# go-appkit BuildFlow policy — non-default values ONLY (canonical keys per the
# buildflow skill; unknown keys warn on every load).
env:
  # GOTOOLCHAIN removed 2026-10-07: auto-derived by BuildFlow when the repo
  # floor (go 1.27.1) exceeds the local go (1.26.7); directive equality
  # policy is enforced by scripts/check-go-directives.sh, not this env pin.
  # Hermetic per-module resolution: ./integration is NOT a workspace member
  # (pin charter: published tags only), so plain golangci-lint inside it dies
  # with "directory prefix . does not contain modules listed in go.work"
  # (seen live 2026-10-06, 2 of 13 nodes). GOWORK=off is also how consumers
  # resolve every module, making it the more honest lint mode fleet-wide.
  GOWORK: "off"
tool_options:
  go-version-auto-configure:
    respect_patch_floor: true
  # samber/lo boundary (2026-10-13, SUPERB v7 T02-T04): test-only
  # adoption DONE by hand (lo v1.53.0 direct require in cqrs/otel/realtime
  # + integration); runtime sites stay hand-rolled. lotidy stays excluded so
  # BuildFlow never auto-applies lo anywhere — the boundary is hand-curated
  # by design (LarsArtmann/go-auto-upgrade#3 still tracks the migrator gap).
  go-auto-upgrade:
    migrators: "recommended,-lotidy"

skip_steps:
  # go-work-sync SKIPPED 2026-10-12 (leak #8): the step treats any on-disk
  # module missing from go.work as drift and re-added ./integration — but
  # integration is deliberately NOT a workspace member (pin charter: published
  # tags only, integration/doc.go). BuildFlow#46 (closed 2026-10-12, ships in
  # BuildFlow v0.8.0) fixed the leak class properly via go_mod_ignore_dirs
  # honored on all four go.work surfaces — SWAP this skip for
  # `go_mod_ignore_dirs: [integration]` once the system binary is >= v0.8.0
  # (installed binary 764c23c predates the fix; until then this skip is the
  # only leak guard). scripts/check-workspace-charter.sh stays the membership
  # authority in BOTH directions either way.
  - go-work-sync
# go-version-auto-configure UNSKIPPED 2026-10-07: gvac v0.2.5's
# respect_patch_floor makes this repo's deliberate PATCH-level pins
# (go 1.27.1, strict equality across all 11 go.mods + go.work,
# scripts/check-go-directives.sh) policy instead of drift — at or below
# the installed toolchain they are reported by no rule at all, so the
# v0.1.4-class downgrade cannot recur. Option lives in tool_options.
