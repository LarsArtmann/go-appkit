# go-appkit BuildFlow policy — non-default values ONLY (canonical keys per the
# buildflow skill; unknown keys warn on every load).
env:
  # The machine default toolchain is go1.26.7 with GOTOOLCHAIN=local, while the
  # unified repo floor is go 1.27.1. Without this, every BuildFlow go
  # subprocess (govulncheck, license-check, tidy, golangci-lint's embedded go)
  # fails with "requires go >= 1.27.1" — seen live 2026-09-29 across three
  # surfaces before this line existed.
  GOTOOLCHAIN: go1.27.1
  # Hermetic per-module resolution: ./integration is NOT a workspace member
  # (pin charter: published tags only), so plain golangci-lint inside it dies
  # with "directory prefix . does not contain modules listed in go.work"
  # (seen live 2026-10-06, 2 of 13 nodes). GOWORK=off is also how consumers
  # resolve every module, making it the more honest lint mode fleet-wide.
  GOWORK: "off"
skip_steps:
  # go-licenses runs through BuildFlow's nix-run sandbox, which carries its
  # own pre-1.27 go — it cannot load a module requiring go >= 1.27.1 ("go:
  # go.mod requires go >= 1.27.1 (running go 1.26.7; GOTOOLCHAIN=local)",
  # every module, 2026-09-29). Repo-side env cannot reach the nix-run
  # sandbox; the fix belongs upstream (give the go-licenses runner a
  # >=1.27 toolchain). Re-enable when BuildFlow ships that.
  - license-check
  # go-structure-linter: BuildFlow's step runs the binary WITHOUT the three
  # --exclude flags the repo's documented invocation requires
  # (root-package-files / internal-directory / examples-directory — the root
  # package IS the public `appkit` package, see AGENTS.md), producing 9
  # false findings; the linter's own yaml exclude config is inert in the
  # installed binary (documented upstream gap). The repo runs the linter
  # directly with the flags; re-enable when BuildFlow supports per-tool
  # rule excludes or the binary honors its config file.
  - go-structure-linter
  # This repo deliberately pins PATCH-level go directives (go 1.27.1) with
  # strict equality across all 11 go.mods + go.work, enforced by
  # scripts/check-go-directives.sh and integration's documentedGoDirective
  # fixture. The fleet major.minor-only policy reports ~10 noise findings per
  # run, and the normalize family downgraded flightrecorderhealth's directive
  # to go 1.27 AFTER the 2026-09-29 unification train — the downgrade shipped
  # in v0.1.4 and had to be corrected in v0.1.5. Do not re-enable without
  # changing the repo's floor policy first.
  - go-version-auto-configure
