name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

permissions:
  contents: read

env:
  GOPRIVATE: "github.com/larsartmann/*,github.com/LarsArtmann/*"

jobs:
  # Single loud failure when the private-repo secret is missing. Since the
  # 2026-10-14 split nothing NEEDS this job for coverage: every go-appkit
  # dependency is a public repo, so the test matrix runs unauthenticated over
  # HTTPS and the matrix can no longer go dark on a missing secret (that
  # class of blind spot ran red-and-unnoticed for 6 days, 2026-10-01..07:
  # every guard and proxy-smoke job was green while the matrix was dead).
  # The secret now gates only the PRIVATE go-structure-linter binary (the
  # structure-linter job rides this job) and the optional SSH fallback steps
  # in the test matrix.
  ci-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH_PRIVATE_KEY secret is present
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$SSH_KEY" ]]; then
            echo "::error::SSH_PRIVATE_KEY resolves empty - restore the repo secret (Settings -> Secrets -> Actions). The test matrix runs unauthenticated (all deps public); only the structure-linter job (private binary) and the SSH fallback steps wait on this secret."
            exit 1
          fi

  # Per-module build + vet + test + race, mirroring the documented local
  # commands in AGENTS.md ("Sub-module Build Commands"). The root core module
  # has no go.work-safe standalone build issue; each module builds standalone
  # so published-tag drift is caught before tagging.
  #
  # Runs UNAUTHENTICATED: every larsartmann/* dependency is a public repo
  # (proven on every push by proxy-smoke resolving the same trees over
  # anonymous HTTPS), so a missing SSH secret can no longer dark-skip the
  # matrix. The SSH steps below are an optional fallback: they activate only
  # when the secret exists, so a future private dependency keeps working.
  test:
    runs-on: ubuntu-latest
    env:
      SSH_KEY_PRESENT: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        module: [
          ".",
          ./cqrs,
          ./realtime,
          ./security,
          ./systemd,
          ./otel,
          ./health,
          ./flightrecorder,
          ./flightrecorderhealth,
          ./errorpages,
          ./docs,
          ./integration,
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git for private repos
        if: github.event_name != 'pull_request' && env.SSH_KEY_PRESENT == 'true'
        run: git config --global url."ssh://git@github.com/LarsArtmann/".insteadOf "https://github.com/LarsArtmann/"
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: github.event_name != 'pull_request' && env.SSH_KEY_PRESENT == 'true'
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go vet ./...
      - name: Test (race)
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go test ./... -race -count=1

  # Fresh-consumer proxy smoke: a clean module resolves each RELEASED module
  # from the module proxy, imports it, and builds. Catches proxy-unresolvable
  # tags and missing-dep packaging before consumers do. The matrix covers all
  # ten released modules (integration is never released and stays out).
  proxy-smoke:
    runs-on: ubuntu-latest
    # Deliberately NOT needs:test: this job verifies the module PROXY and
    # published-tag packaging from a fresh checkout — it has no dependency on
    # the working tree, so it must stay green (or red on its own merits) even
    # when the test matrix fails on infrastructure (e.g. the owner-gated SSH
    # secret). Previously a needs:test edge made it skip 0s whenever the
    # matrix died at the ssh-agent step, hiding the proxy signal entirely.
    strategy:
      fail-fast: false
      matrix:
        module: [
          github.com/larsartmann/go-appkit,
          github.com/larsartmann/go-appkit/cqrs,
          github.com/larsartmann/go-appkit/realtime,
          github.com/larsartmann/go-appkit/security,
          github.com/larsartmann/go-appkit/otel,
          github.com/larsartmann/go-appkit/health,
          github.com/larsartmann/go-appkit/flightrecorder,
          github.com/larsartmann/go-appkit/flightrecorderhealth,
          github.com/larsartmann/go-appkit/errorpages,
          github.com/larsartmann/go-appkit/docs,
          github.com/larsartmann/go-appkit/systemd,
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve latest tag of ${{ matrix.module }}
        id: latest
        run: echo "version=$(go list -m -versions ${{ matrix.module }} | tr ' ' '\n' | grep -E '^v[0-9]+\.' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Build fresh consumer against ${{ matrix.module }}@${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cd "$dir"
          go mod init smoke
          go get ${{ matrix.module }}@${{ steps.latest.outputs.version }}
          cat > main.go <<EOF
          package main

          import (
              "fmt"

              _ "${{ matrix.module }}"
          )

          func main() { fmt.Println("import OK") }
          EOF
          go mod tidy
          go build ./...
          echo "proxy smoke OK for ${{ matrix.module }}@${{ steps.latest.outputs.version }}"

  # cqrs-lint over the framework modules that consume go-cqrs-lite.
  # Arg form is "." (not ./...) — a single --path flag.
  cqrs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install cqrs-lint
        run: go install github.com/larsartmann/go-cqrs-lite/cmd/cqrs-lint/v4@latest
      - name: Lint cqrs module
        working-directory: cqrs
        run: GOWORK=off cqrs-lint .

  # Pin-drift guard (SUPERB plan v4 C1): the AGENTS.md release line must name
  # a real tag, integration/go.mod must pin the LATEST published tag of every
  # family module it requires, and go.mod/go.work must agree on the go
  # directive. Needs full tag history — fetch-depth: 0. The go.mod-side half
  # of the guard runs as integration/pin_drift_test.go in the test matrix.
  pin-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release-state pin drift
        run: ./scripts/check-pin-drift.sh

  # Go-directive parity (plan 2026-09-20 T05): every module's go.mod must
  # declare the same go directive as go.work. Cheap, history-free guard for
  # the 2026-09-18 root-directive drift that broke every workspace command.
  go-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check go.mod directive parity
        run: ./scripts/check-go-directives.sh

  # SSE-test protocol guard (17-49 f7, 2026-10-18): realtime.Handler
  # flushes headers BEFORE subscribing, so a test broadcasting right after
  # connect() races the subscribe step — a dropped broadcast then hangs
  # MustReadNEvents until the 10m panic (the 2026-10-13 rate-limit SSE E2E
  # incident class). Requires a SubscriberCount sync near every test-file
  # broadcast. Offline grep guard, no Go toolchain needed.
  sse-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SSE broadcast sync protocol
        run: ./scripts/check-sse-protocol.sh

  # Config parity: every Go module directory must have a dependabot gomod
  # entry AND a CI test-matrix slot, and no dependabot entry may name a
  # directory without a go.mod. Makes the hand-verified 2026-09-17 /security
  # byte-identical check permanent.
  config-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependabot + CI matrix parity
        run: ./scripts/check-dependabot-parity.sh

  # Workspace charter (2026-10-06): go.work must carry exactly the root +
  # every go.mod directory except ./integration (pin charter: published tags
  # only). The auto-commit daemon re-added the leaked membership twice after
  # manual reverts; this makes the next one fail loudly.
  workspace-charter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check go.work membership charter
        run: ./scripts/check-workspace-charter.sh

  # golangci-lint schema guard (SUPERB v7 T05, 2026-10-13): `config verify`
  # validates every module's .golangci.yml against the pinned binary's
  # schema — the check that would have caught the dead exhaustruct_v5
  # settings blocks at authoring time (2026-10-12). golangci-lint is a
  # PUBLIC module, so installing it needs no SSH key and this job does NOT
  # ride ci-preflight.
  golangci-config-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Verify all module configs
        run: ./scripts/check-golangci-configs.sh

  # Per-module golangci-lint over the whole fleet (2026-10-25): lint was
  # LOCAL-ONLY before this job (verify-all.sh), so daemon/dependabot commits
  # landed unlinted — proven by 7 latent findings in a cqrs test file that
  # shipped through multiple green CI runs. Reuses the fleet's own verify
  # loop in lint-only mode (--skip-tests leaves build/vet/test to the test
  # matrix), one module at a time, sequential (the shared-cache race rule).
  # golangci-lint is a PUBLIC module — this job does NOT ride ci-preflight.
  fleet-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint (pinned to the fleet version)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint all 12 modules (verify-all, lint-only)
        run: ./scripts/verify-all.sh --skip-tests

  # Clone-regression gate (SUPERB v9 follow-up, 2026-10-19): the standing
  # art-dupl gate (scripts/check-art-dupl.sh + committed baseline) also runs
  # on every push — NEW clone groups fail CI while the adjudicated accepted
  # classes stay green. art-dupl is a PUBLIC module (proxy-served), so
  # installing it needs no SSH key and this job does NOT ride ci-preflight.
  # PIN = the commit the baseline was generated and clean-runner-verified
  # with (v0.9.0-0.20261017225421-93432fd910fb) — the v0.9.0 TAG build lags
  # two commits behind and false-flags all 9 baseline groups as new
  # (verified 2026-10-19 against a proxy install). Keep this pin in lockstep
  # with the local nix-installed binary whenever the gate is re-baselined;
  # move to the next stable tag after a tag build reproduces a green check.
  art-dupl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install art-dupl (pinned to the baseline-verified commit)
        # The binary lives in cmd/art-dupl — the module ROOT carries no Go
        # package, so this bare-module install failed on every runner since
        # the job shipped (2026-10-19): "found, but does not contain package
        # github.com/LarsArtmann/art-dupl". Path proven against the pinned
        # pseudo-version via a fresh-GOMODCACHE proxy build (2026-10-25).
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.9.1-0.20261017225421-93432fd910fb
      - name: Check clone groups against the committed baseline
        run: ./scripts/check-art-dupl.sh

  # Structure-linter config guard (2026-10-12): the binary exits 0 even when
  # it REPORTS findings, so a silently lost .go-structure-linter.yaml would
  # stay green while the 11 deliberate-layout findings return. The guard
  # script fails on any findings total > 0 or a missing config file.
  structure-linter:
    # The linter binary is PRIVATE (github.com/LarsArtmann/go-structure-linter
    # is the one family repo not public), so installing it needs the SSH key:
    # this job alone still rides ci-preflight — skipped (not broken, and not
    # vacuously green) until the secret is restored. The equivalent check runs
    # locally via scripts/check-structure-linter.sh on every session.
    needs: ci-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install go-structure-linter
        run: go install github.com/LarsArtmann/go-structure-linter/cmd/go-structure-linter@latest
      - name: Check structure (config present, zero findings)
        run: ./scripts/check-structure-linter.sh

  # Example smoke (SUPERB v6 T13): the seven example dirs carry no test
  # files; this job builds each hermetically, boots it on an ephemeral
  # port, probes health + one distinctive route, SIGTERMs, and requires
  # the graceful-shutdown line. Replaces dated hand-run "live-verified"
  # claims with mechanical evidence on every push.
  example-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Smoke all examples (build, boot, probe, graceful stop)
        run: ./scripts/example-smoke.sh
