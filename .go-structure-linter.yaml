# go-appkit structure-linter config
#
# The root module IS the public `appkit` package (import path
# github.com/larsartmann/go-appkit resolves to the package at root — the
# framework's public layout, not misplaced application code). The seven
# core package files (service.go, config.go, middleware.go, logger.go,
# health.go, errors.go, shutdown.go) are the public API surface.
#
# NOTE: despite its name, `exclude_patterns` removes RULES by name
# (verified against go-structure-linter's config_builder: "ExcludePatterns
# removes rules by name"); it is not a file-pattern list.
exclude_patterns:
  - root-package-files
  - internal-directory
  - examples-directory
