version: "2"
run:
    timeout: 3m
    go: "1.26.5"
output:
    formats: {}
linters:
    default: standard
    enable:
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - containedctx
        - copyloopvar
        - decorder
        - dogsled
        - dupl
        - durationcheck
        - err113
        - errorlint
        - exhaustive
        - exhaustruct
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - godoclint
        - godot
        - godox
        - goheader
        - gomoddirectives
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - ireturn
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - noinlineerr
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
    settings:
        varnamelen:
            ignore-map-index-ok: true
            ignore-names:
                - err
                - ok
                - tt
                - fn
                - t
                - i
                - m
                - g
                - a
                - b
                - v
                - w
                - r
                - c
                - tc
                - cc
            ignore-type-assert-ok: true
        exhaustruct:
            exclude:
                - sync.Mutex
                - time.Time
        revive:
            rules:
                - disabled: true
                  name: exported
                - disabled: true
                  name: package-comments
    exclusions:
        generated: lax
        rules:
            - path: _test\.go
              linters:
                - mnd
                - exhaustruct
                - err113
                - paralleltest
                - gochecknoglobals
                - goconst
                - varnamelen
                - wsl_v5
                - funlen
                - cyclop
                - testpackage
            - path: _test\.go
              text: unused
              linters:
                - unused
        paths:
            - vendor/
formatters:
    enable:
        - goimports
        - gofumpt
        - golines
    settings:
        golines:
            max-len: 120
    exclusions:
        generated: lax
issues:
    max-issues-per-linter: 50
    max-same-issues: 10
